name: Replay indexing optimization tests

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/replay-performance-binary-search-20261028
    paths:
      - "historical_backtest.py"
      - "tests/**"
      - ".github/workflows/replay-optimization-tests.yml"
      - "main.py"
      - "requirements.txt"

permissions:
  contents: read

jobs:
  offline-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile and run offline regression tests
        run: |
          python -m py_compile main.py historical_backtest.py tests/test_shadow_ledger.py tests/test_replay_indexing.py
          python -c "import main; main.self_test()"
          python -m unittest discover -s tests -v
