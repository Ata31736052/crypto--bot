name: Experimental 180-day historical A/B replay

on:
  push:
    branches:
      - experiment/resistance-headroom-gate-20261021-sync
      - experiment/shadow-ledger-20261022
    paths:
      - "main.py"
      - "historical_backtest.py"
      - "requirements.txt"
      - ".github/workflows/historical-backtest.yml"

permissions:
  contents: read

concurrency:
  group: historical-ab-replay-${{ github.ref }}
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      BACKTEST_DAYS: "180"
      BACKTEST_MAX_SYMBOLS: "30"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile and run offline regression tests
        run: |
          python -m py_compile main.py historical_backtest.py
          python -c "import main; main.self_test()"
      - name: Run 180-day A/B replay (no Telegram or live orders)
        run: |
          set -o pipefail
          python historical_backtest.py 2>&1 | tee historical-backtest.log
      - name: Upload replay results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apexsignal-180d-ab-replay
          path: |
            backtest-artifacts/
            historical-backtest.log
          if-no-files-found: warn
          retention-days: 30

