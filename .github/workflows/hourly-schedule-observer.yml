name: Hourly Schedule Observer (Read-only)

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: hourly-schedule-observer
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  observe:
    name: Record scheduler execution metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record this run
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule || '' }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          WORKFLOW: ${{ github.workflow }}
          ACTOR: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          record = {
              "observed_at_utc": datetime.now(timezone.utc).isoformat(),
              "event_name": os.environ["EVENT_NAME"],
              "event_schedule": os.environ.get("EVENT_SCHEDULE", ""),
              "run_id": os.environ["RUN_ID"],
              "run_attempt": os.environ["RUN_ATTEMPT"],
              "sha": os.environ["SHA"],
              "ref": os.environ["REF"],
              "workflow": os.environ["WORKFLOW"],
              "actor": os.environ["ACTOR"],
              "repository": os.environ["REPOSITORY"],
              "purpose": "read-only schedule delivery observation; no market scan or Telegram activity",
          }
          Path("schedule-observation.json").write_text(
              json.dumps(record, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(record, indent=2))
          PY

      - name: Preserve observation artifact
        uses: actions/upload-artifact@v4
        with:
          name: schedule-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: schedule-observation.json
          if-no-files-found: error
          retention-days: 30
