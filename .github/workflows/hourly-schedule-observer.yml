name: Hourly Schedule Observer (Read-only)

on:
  schedule:
    # Run after the production workflow's :10 hourly trigger.
    - cron: "25 * * * *"
    - cron: "55 * * * *"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/hourly-schedule-observer.yml"

concurrency:
  group: hourly-schedule-observer
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  observe:
    name: Verify production schedule delivery (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compare observer event with latest production schedule run
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule || '' }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          OBSERVER_SHA: ${{ github.sha }}
          OBSERVER_REF: ${{ github.ref }}
          OBSERVER_WORKFLOW: ${{ github.workflow }}
          OBSERVER_ACTOR: ${{ github.actor }}
          PRODUCTION_WORKFLOW_ID: "376115476"
          MAX_AGE_MINUTES: "75"
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime, timezone

          repo = os.environ["REPOSITORY"]
          workflow_id = os.environ["PRODUCTION_WORKFLOW_ID"]
          endpoint = (
              f"https://api.github.com/repos/{repo}/actions/workflows/"
              f"{workflow_id}/runs?branch=main&event=schedule&per_page=20"
          )
          request = urllib.request.Request(
              endpoint,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "ApexSignal-read-only-schedule-observer",
              },
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              payload = json.load(response)

          runs = payload.get("workflow_runs", [])
          latest = max(runs, key=lambda item: item["created_at"]) if runs else None
          now = datetime.now(timezone.utc)
          max_age = int(os.environ["MAX_AGE_MINUTES"])

          record = {
              "observed_at_utc": now.isoformat(),
              "observer": {
                  "event": os.environ["EVENT_NAME"],
                  "schedule": os.environ.get("EVENT_SCHEDULE", ""),
                  "run_id": os.environ["RUN_ID"],
                  "run_attempt": os.environ["RUN_ATTEMPT"],
                  "sha": os.environ["OBSERVER_SHA"],
                  "ref": os.environ["OBSERVER_REF"],
                  "workflow": os.environ["OBSERVER_WORKFLOW"],
                  "actor": os.environ["OBSERVER_ACTOR"],
              },
              "production_workflow_id": workflow_id,
              "production_runs_checked": len(runs),
              "purpose": "read-only verification; never dispatches scans or sends Telegram messages",
          }

          if latest is None:
              record["observer_status"] = "NO_PRODUCTION_SCHEDULE_RUN_FOUND"
              record["production_run"] = None
          else:
              created = datetime.fromisoformat(latest["created_at"].replace("Z", "+00:00"))
              age_minutes = round((now - created).total_seconds() / 60, 1)
              run_status = latest.get("status")
              conclusion = latest.get("conclusion")
              if run_status != "completed":
                  observer_status = "PRODUCTION_RUN_IN_PROGRESS"
              elif conclusion != "success":
                  observer_status = "LATEST_PRODUCTION_RUN_FAILED"
              elif age_minutes > max_age:
                  observer_status = "PRODUCTION_SCHEDULE_STALE"
              else:
                  observer_status = "PRODUCTION_SCHEDULE_RECENT_SUCCESS"

              record["observer_status"] = observer_status
              record["production_run"] = {
                  "id": latest["id"],
                  "run_number": latest["run_number"],
                  "html_url": latest["html_url"],
                  "created_at": latest["created_at"],
                  "status": run_status,
                  "conclusion": conclusion,
                  "age_minutes": age_minutes,
                  "max_age_minutes": max_age,
              }

          print(json.dumps(record, indent=2))
          with open("production-schedule-observation.json", "w", encoding="utf-8") as output:
              json.dump(record, output, indent=2)
              output.write("\n")
          PY

      - name: Preserve observation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-schedule-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: production-schedule-observation.json
          if-no-files-found: warn
          retention-days: 30
