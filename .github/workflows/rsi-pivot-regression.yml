name: ApexSignal RSI Pivot Regression

on:
  pull_request:
    branches: [main]
    paths:
      - "main.py"
      - "requirements.txt"
      - ".github/workflows/rsi-pivot-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run regression self-tests only
        run: python -c "import main; main.self_test()"
