name: EarlyEdge Research Tests

on:
  push:
    branches: [experiment/earlyedge-replacement-20261124]
    paths:
      - "research/earlyedge/**"
      - ".github/workflows/earlyedge-research.yml"
  pull_request:
    branches: [main]
    paths:
      - "research/earlyedge/**"
      - ".github/workflows/earlyedge-research.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile and test research backtester
        run: |
          python -m py_compile research/earlyedge/backtest.py
          python -m unittest discover -s research/earlyedge/tests -v
