name: ApexSignal Read-Only Market Audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apexsignal-readonly-market-audit
  cancel-in-progress: false

jobs:
  market-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Tehran
      # Intentionally no Telegram credentials: send_telegram() remains disabled.
      TELEGRAM_TOKEN: ""
      TELEGRAM_CHAT_ID: ""
      SIGNAL_STATE_FILE: "audit_signals_state.json"
      ACCOUNT_USDT: "1000"
      RISK_PCT: "1.0"
      MAX_POSITION_USDT: "1000"
    steps:
      - name: Checkout diagnostic branch only
        uses: actions/checkout@v4
        with:
          ref: diagnostics/v3.21.2-rsi-pivot-regression-tests
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify self-tests before live scan
        run: python -c "import main; main.self_test()"

      - name: Run read-only live Binance market audit
        shell: bash
        run: |
          set -o pipefail
          python main.py 2>&1 | tee market-audit.log

      - name: Upload audit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apexsignal-readonly-market-audit
          path: market-audit.log
          if-no-files-found: warn
          retention-days: 7
