name: EarlyEdge Prototype Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'earlyedge_strategy.py'
      - 'tests/test_earlyedge_strategy.py'
      - '.github/workflows/earlyedge-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing runtime dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas
      - name: Compile and run focused tests
        run: |
          python -m py_compile earlyedge_strategy.py tests/test_earlyedge_strategy.py
          python -m unittest discover -s tests -p 'test_earlyedge_strategy.py' -v
