name: ApexSignal Crypto Bot

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Production signal scan or read-only market audit"
        required: true
        type: choice
        options:
          - production
          - audit
        default: production
  schedule:
    - cron: "10 */4 * * *"
  push:
    branches: [main]
    paths:
      - "main.py"
      - "requirements.txt"
      - ".github/workflows/apex-signal.yml"
  pull_request:
    branches: [main]
    paths:
      - "main.py"
      - "requirements.txt"
      - ".github/workflows/apex-signal.yml"

concurrency:
  group: apexsignal-${{ github.event_name == 'schedule' && 'scheduled' || inputs.mode || 'checks' }}
  cancel-in-progress: false

jobs:
  regression:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile and run regression self-tests
        run: |
          python -m py_compile main.py
          python -c "import main; main.self_test()"

  production-scan:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'production')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      TZ: Asia/Tehran
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SIGNAL_STATE_FILE: "signals_state.json"
      ACCOUNT_USDT: "1000"
      RISK_PCT: "1.0"
      MAX_POSITION_USDT: "1000"
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile and run regression self-tests
        run: |
          python -m py_compile main.py
          python -c "import main; main.self_test()"
      - name: Run ApexSignal
        run: python main.py
      - name: Save signal state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add signals_state.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: update signals_state.json [skip ci]"
          git push || true

  read-only-audit:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'audit'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      TZ: Asia/Tehran
      TELEGRAM_TOKEN: ""
      TELEGRAM_CHAT_ID: ""
      SIGNAL_STATE_FILE: "audit_signals_state.json"
      ACCOUNT_USDT: "1000"
      RISK_PCT: "1.0"
      MAX_POSITION_USDT: "1000"
    steps:
      - name: Checkout production branch for read-only audit
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile and run regression self-tests
        run: |
          python -m py_compile main.py
          python -c "import main; main.self_test()"
      - name: Run read-only live Binance market audit
        shell: bash
        run: |
          set -o pipefail
          python main.py 2>&1 | tee market-audit.log
      - name: Upload audit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apexsignal-readonly-market-audit
          path: market-audit.log
          if-no-files-found: warn
          retention-days: 7
