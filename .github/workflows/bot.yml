name: Crypto Signal Bot

on:

  schedule:
    # اجرای تقریبی هر ساعت
    - cron: '7 * * * *'

  workflow_dispatch:

jobs:

  run-bot:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Crypto Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python bot.py

      - name: Save State File
        run: |

          git config --local user.email \
            "github-actions[bot]@users.noreply.github.com"

          git config --local user.name \
            "github-actions[bot]"

          git add signals_state.json

          if git diff --cached --quiet; then
            echo "No state changes."
            exit 0
          fi

          git commit -m "chore: update signal state [skip ci]"

          git push origin main          git config --local user.name "github-actions[bot]"
          git pull origin main --rebase || true
          git add signals_state.json
          git commit -m "update: auto update signals state [skip ci]" || exit 0
          git push origin main
          
