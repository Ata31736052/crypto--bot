name: Crypto Signal Bot

on:
  # هر ۴ ساعت یکبار — ساعت‌های 00:00, 04:00, 08:00, 12:00, 16:00, 20:00 UTC
  # (به وقت ایران: 03:30, 07:30, 11:30, 15:30, 19:30, 23:30)
  schedule:
    - cron: '0 */4 * * *'

  # دکمه‌ی اجرای دستی از تب Actions
  workflow_dispatch:

# اجازه‌ی commit کردن state file
permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run signal bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py

      - name: Upload log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-log-${{ github.run_number }}
          path: bot.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit state file
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f signals_state.json ]; then
            git add signals_state.json
            git diff --staged --quiet || git commit -m "Update state [skip ci]"
            git push || true
          fi
