name: Crypto Signal Bot 4H Scanner

on:
  schedule:
    # اجرا هر ۴ ساعت یک‌بار (ساعات 00:00, 04:00, 08:00, 12:00, 16:00, 20:00 به وقت UTC)
    - cron: '0 */4 * * *'
  workflow_dispatch: # امکان اجرای دستی مستقیم از تب Actions

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: دریافت آخرین کدها از ریپازیتوری
        uses: actions/checkout@v4

      - name: راه اندازی پایتون
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: اجرای ربات سیگنال دهی
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py
        
