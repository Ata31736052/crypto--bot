name: Crypto Signal Bot 4H

on:
  schedule:
    # اجرا سر هر ۴ ساعت طبق کندل‌های جهانی کریپتو (00:00, 04:00, 08:00, 12:00, 16:00, 20:00 به وقت UTC)
    - cron: '0 0,4,8,12,16,20 * * *'
  workflow_dispatch: # امکان اجرای دستی اسکریپت از تب Actions جهت تست فوری

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Crypto Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TZ: 'Asia/Tehran' # تنظیم تایم‌زون محیط اجرا برای ثبت دقیق زمان گزارش‌ها
        run: python bot.py
        
