name: Crypto Signal Bot 4H

on:
  schedule:
    # اجرای خودکار هر ۲ ساعت یک‌بار (سر ساعت‌های زوج به وقت UTC)
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache signals state
        uses: actions/cache@v4
        with:
          path: signals_state.json
          key: state-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            state-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy

      - name: Run Crypto Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py

      - name: Commit and push updated state
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add signals_state.json || true
          git commit -m "Update signals state [skip ci]" || true
          git push || true
          
