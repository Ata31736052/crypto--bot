name: Crypto Signal Bot

on:
  schedule:
    # هر 15 دقیقه یکبار (GitHub ممکنه تا 5-10 دقیقه تاخیر داشته باشه)
    - cron: '*/15 * * * *'
  workflow_dispatch:  # اجرای دستی

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install deps
        run: pip install requests pandas numpy
      
      - name: Restore state cache
        uses: actions/cache/restore@v4
        with:
          path: |
            signals_state.json
            signals_history.json
            cooldown_state.json
          key: bot-state-${{ github.run_id }}
          restore-keys: |
            bot-state-
      
      - name: Run bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py
      
      - name: Save state cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            signals_state.json
            signals_history.json
            cooldown_state.json
          key: bot-state-${{ github.run_id }}
