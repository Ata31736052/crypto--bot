name: ApexSignal Crypto Bot

on:
  workflow_dispatch:          # اجرای دستی از تب Actions
  schedule:
    - cron: "10 */4 * * *"    # هر ۴ ساعت یک‌بار (مناسب نوسان‌گیری ۴H)

permissions:
  contents: write

concurrency:
  group: crypto-signal-bot-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30       # زمان کافی برای اسکن کامل
    env:
      TZ: Asia/Tehran
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SIGNAL_STATE_FILE: "signals_state.json"
      ACCOUNT_USDT: "1000"
      RISK_PCT: "1.0"
      MAX_POSITION_USDT: "1000"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ApexSignal
        run: python main.py

      - name: Save signal state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add signals_state.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: update signals_state.json [skip ci]"
          git push || true
